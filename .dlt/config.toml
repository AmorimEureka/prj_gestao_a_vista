# put your configuration values here

[runtime]
log_level="WARNING"  # the system log level of dlt
# use the dlthub_telemetry setting to enable/disable anonymous usage data reporting, see https://dlthub.com/docs/reference/telemetry
dlthub_telemetry = true

[sources.sql_database]
default_source_schema = "DBAMV"
table_names = [
    "ATENDIME",
    "PACIENTE",
    "USUARIOS",
    "UNID_INT",
    "LEITO",
    "MOT_ALT",
]


[sources.sql_database.ATENDIME]
included_columns = [
    "CD_ATENDIMENTO",
    "CD_PACIENTE",
    "CD_CONVENIO",
    "CD_LEITO",
    "DT_ATENDIMENTO",
    "DT_ALTA",
    "HR_ALTA",
    "HR_ATENDIMENTO",
    "TP_ATENDIMENTO",
    "SN_OBITO"
]
incremental_column="DT_ATENDIMENTO"
primary_key="CD_ATENDIMENTO"
initial_value="2025-01-01"
write_disposition="merge"


[sources.sql_database.PACIENTE]
included_columns = [
    "CD_PACIENTE",
    "NM_PACIENTE",
    "NM_MAE",
    "DT_NASCIMENTO"
]
incremental_column="CD_PACIENTE"
primary_key="CD_PACIENTE"
initial_value=1
