    "CD_USUARIO",
    "CD_MATRICULA",
    "NM_USUARIO",
    "SN_ATIVO"
]
incremental_column="CD_USUARIO"
primary_key="CD_USUARIO"
initial_value=1
write_disposition="merge"


[sources.sql_database.UNID_INT]
included_columns = [
    "CD_UNID_INT",
    "DS_UNID_INT",
    "SN_ATIVO"

]
incremental_column="CD_UNID_INT"
primary_key="CD_UNID_INT"
initial_value=1
write_disposition="merge"


[sources.sql_database.LEITO]
included_columns = [
    "CD_LEITO",
    "CD_UNID_INT",
    "DS_LEITO",
    "TP_OCUPACAO",
    "TP_SITUACAO"
]
incremental_column="CD_LEITO"
primary_key="CD_LEITO"
initial_value=1
write_disposition="merge"


[sources.sql_database.MOT_ALT]
included_columns = [
    "CD_MOT_ALT",
    "DS_MOT_ALT",
