version: 2

models:
  - name: int_ocupacao_atual_leito
    description: Ocupação atual por leito e unidade, considerando somente atendimentos ativos.
    columns:
      - name: unidade_id
        description: Identificador da unidade de internação associada ao leito.
        tests:
          - not_null
      - name: leito_id
        description: Identificador do leito.
        tests:
          - not_null
      - name: paciente_id
        description: Identificador do paciente atualmente alocado no leito.
        tests:
          - not_null
      - name: dh_atendimento
        description: Data/hora do atendimento (combinação de dt_atendimento e hr_atendimento).
        tests:
          - not_null
      - name: atendimento_id
        description: Identificador do atendimento que define a ocupação atual.
        tests:
          - not_null

  - name: int_evento_troca_ocupacao
    description: Eventos de troca de ocupação por unidade e leito, derivados do snapshot de ocupação atual.
    columns:
      - name: evento_troca_id
        description: Identificador sequencial do evento de troca.
        tests:
          - not_null
          - unique
      - name: unidade_id
        description: Identificador da unidade de internação associada ao leito no evento.
        tests:
          - not_null
      - name: leito_id
        description: Identificador do leito.
        tests:
          - not_null
      - name: paciente_id_anterior
        description: Paciente anteriormente alocado no leito.
      - name: paciente_id_atual
        description: Paciente atualmente alocado no leito após a troca.
        tests:
          - not_null
      - name: atendimento_id_anterior
        description: Atendimento anteriormente alocado no leito.
      - name: atendimento_id_atual
        description: Atendimento atualmente alocado no leito após a troca.
        tests:
          - not_null
      - name: dt_troca
        description: Timestamp de início da nova vigência da ocupação.
        tests:
          - not_null
      - name: dt_fim_vigencia
        description: Timestamp de fim da vigência do registro no snapshot.
      - name: data_referencia
        description: Data de referência derivada de dt_troca.
        tests:
          - not_null
